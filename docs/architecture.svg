<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <style>
      .t{font-size:14px;fill:#111827}.s{font-size:11.5px;fill:#4b5563}.h{font-size:15px;font-weight:600}
      .box{rx:8;stroke-width:1.5}.ln{stroke:#374151;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .dash{stroke-dasharray:6 4}
    </style>
  </defs>
  <rect width="1200" height="820" fill="#ffffff"/>
  <text x="600" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Architecture cible — cloud5 (AWS, us-east-1)</text>

  <!-- Internet / users -->
  <rect x="520" y="56" width="160" height="44" class="box" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="600" y="83" text-anchor="middle" class="t">Utilisateurs / Internet</text>

  <!-- CI/CD -->
  <rect x="24" y="56" width="250" height="150" class="box" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="40" y="80" class="h" fill="#5b21b6">CI/CD</text>
  <text x="40" y="104" class="t">Développeurs → Git (GitHub)</text>
  <text x="40" y="126" class="t">GitHub Actions</text>
  <text x="40" y="146" class="s">fmt · init · validate · plan</text>
  <text x="40" y="164" class="s">apply : dev auto, test/prod approuvés</text>
  <text x="40" y="184" class="s">Auth : OIDC ou secrets chiffrés</text>

  <!-- State backend -->
  <rect x="926" y="56" width="250" height="150" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="942" y="80" class="h" fill="#92400e">Backend Terraform</text>
  <text x="942" y="104" class="t">S3 cloud5-tfstate-…</text>
  <text x="942" y="124" class="s">SSE-KMS · versioning</text>
  <text x="942" y="142" class="s">verrou natif (.tflock)</text>
  <text x="942" y="160" class="s">dev/ · test/ · prod/ séparés</text>
  <text x="942" y="178" class="s">accès public bloqué, TLS exigé</text>
  <path d="M274 190 L926 190" class="ln dash"/>
  <text x="760" y="183" text-anchor="middle" class="s">lecture/écriture de l'état</text>

  <!-- VPC -->
  <rect x="24" y="226" width="1152" height="520" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="44" y="252" class="h" fill="#166534">VPC 10.20.0.0/16</text>
  <rect x="560" y="214" width="80" height="26" rx="6" fill="#16a34a"/>
  <text x="600" y="232" text-anchor="middle" font-size="12" fill="#fff">IGW</text>
  <path d="M600 100 L600 212" class="ln"/>

  <!-- AZ columns -->
  <rect x="60" y="268" width="520" height="460" rx="10" fill="none" stroke="#9ca3af" stroke-dasharray="5 4"/>
  <text x="76" y="290" class="t" font-weight="600">AZ us-east-1a</text>
  <rect x="620" y="268" width="520" height="460" rx="10" fill="none" stroke="#9ca3af" stroke-dasharray="5 4"/>
  <text x="636" y="290" class="t" font-weight="600">AZ us-east-1b</text>

  <!-- public subnets -->
  <rect x="80" y="302" width="480" height="96" class="box" fill="#dbeafe" stroke="#2563eb"/>
  <text x="96" y="324" class="t">Public A — 10.20.1.0/24</text>
  <rect x="640" y="302" width="480" height="96" class="box" fill="#dbeafe" stroke="#2563eb"/>
  <text x="656" y="324" class="t">Public B — 10.20.2.0/24</text>
  <rect x="96" y="338" width="150" height="46" rx="6" fill="#fff" stroke="#2563eb"/>
  <text x="171" y="358" text-anchor="middle" class="t">NAT Gateway</text>
  <text x="171" y="375" text-anchor="middle" class="s">+ EIP (prod : 1/AZ)</text>
  <!-- ALB spanning -->
  <rect x="380" y="336" width="440" height="50" rx="8" fill="#2563eb"/>
  <text x="600" y="358" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">Application Load Balancer</text>
  <text x="600" y="376" text-anchor="middle" font-size="11.5" fill="#dbeafe">HTTP:80 (→ HTTPS:443 si certificat) · sg-alb</text>
  <path d="M600 240 L600 334" class="ln"/>

  <!-- app subnets -->
  <rect x="80" y="420" width="480" height="130" class="box" fill="#ffedd5" stroke="#ea580c"/>
  <text x="544" y="442" text-anchor="end" class="t">Privé App A — 10.20.11.0/24</text>
  <rect x="640" y="420" width="480" height="130" class="box" fill="#ffedd5" stroke="#ea580c"/>
  <text x="1104" y="442" text-anchor="end" class="t">Privé App B — 10.20.12.0/24</text>
  <rect x="200" y="456" width="240" height="78" rx="6" fill="#fff" stroke="#ea580c"/>
  <text x="320" y="478" text-anchor="middle" class="t">EC2 nginx (AL2023)</text>
  <text x="320" y="496" text-anchor="middle" class="s">t3.micro · IMDSv2 · EBS chiffré</text>
  <text x="320" y="513" text-anchor="middle" class="s">sg-app : app_port depuis sg-alb</text>
  <rect x="760" y="456" width="240" height="78" rx="6" fill="#fff" stroke="#ea580c"/>
  <text x="880" y="478" text-anchor="middle" class="t">EC2 nginx (AL2023)</text>
  <text x="880" y="496" text-anchor="middle" class="s">t3.micro · IMDSv2 · EBS chiffré</text>
  <text x="880" y="513" text-anchor="middle" class="s">sg-app : app_port depuis sg-alb</text>
  <rect x="452" y="540" width="296" height="24" rx="12" fill="#ea580c"/>
  <text x="600" y="557" text-anchor="middle" font-size="12" fill="#fff">Auto Scaling Group (min 2 · max 4 · CPU 50 %)</text>
  <path d="M500 386 L330 454" class="ln"/>
  <path d="M700 386 L870 454" class="ln"/>
  <path d="M200 470 L171 386" class="ln dash"/>
  <text x="120" y="420" class="s" transform="rotate(0)"></text>

  <!-- db subnets -->
  <rect x="80" y="584" width="480" height="128" class="box" fill="#fce7f3" stroke="#db2777"/>
  <text x="96" y="606" class="t">Privé DB A — 10.20.21.0/24 · sans Internet</text>
  <rect x="640" y="584" width="480" height="128" class="box" fill="#fce7f3" stroke="#db2777"/>
  <text x="656" y="606" class="t">Privé DB B — 10.20.22.0/24 · sans Internet</text>
  <rect x="200" y="622" width="240" height="76" rx="6" fill="#fff" stroke="#db2777"/>
  <text x="320" y="644" text-anchor="middle" class="t">RDS PostgreSQL 16</text>
  <text x="320" y="662" text-anchor="middle" class="s">db.t3.micro · gp3 chiffré · TLS forcé</text>
  <text x="320" y="679" text-anchor="middle" class="s">sg-db : 5432 depuis sg-app</text>
  <rect x="760" y="622" width="240" height="76" rx="6" fill="#fff" stroke="#db2777" stroke-dasharray="5 3"/>
  <text x="880" y="644" text-anchor="middle" class="t">RDS standby (prod)</text>
  <text x="880" y="662" text-anchor="middle" class="s">Multi-AZ synchrone</text>
  <text x="880" y="679" text-anchor="middle" class="s">DB subnet group privé</text>
  <path d="M432 534 L432 620" class="ln"/>
  <path d="M440 660 L758 660" class="ln dash"/>
  <text x="600" y="652" text-anchor="middle" class="s">réplication</text>

  <!-- side services -->
  <rect x="24" y="762" width="370" height="46" class="box" fill="#ecfeff" stroke="#0891b2"/>
  <text x="40" y="782" class="t">S3 assets · alb-logs · backups</text>
  <text x="40" y="799" class="s">privé · versioning · SSE · cycle de vie · TLS exigé</text>
  <rect x="415" y="762" width="370" height="46" class="box" fill="#fef2f2" stroke="#dc2626"/>
  <text x="431" y="782" class="t">IAM (moindre privilège)</text>
  <text x="431" y="799" class="s">profil EC2 : SSM + lecture assets/ · rôles CI plan/apply</text>
  <rect x="806" y="762" width="370" height="46" class="box" fill="#f5f5f4" stroke="#57534e"/>
  <text x="822" y="782" class="t">Secrets Manager · SSM Session Manager</text>
  <text x="822" y="799" class="s">mot de passe RDS géré · admin sans SSH ni port 22</text>
</svg>
