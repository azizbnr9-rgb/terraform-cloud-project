name: terraform

# ---------------------------------------------------------------------------
# Pull Request      : fmt + validate + plan des 3 environnements (plan commenté sur la PR)
# Push sur main     : plan + apply automatique de DEV
# Déclenchement manuel (workflow_dispatch) : plan + apply/destroy de l'environnement choisi
#   -> test et prod sont protégés par une approbation manuelle (GitHub Environments)
# ---------------------------------------------------------------------------
on:
  pull_request:
    branches: [main]
    paths: ["modules/**", "environments/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["modules/**", "environments/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement ciblé"
        type: choice
        options: [dev, test, prod]
        required: true
      action:
        description: "Action après le plan"
        type: choice
        options: [apply, destroy]
        default: apply

permissions:
  contents: read
  id-token: write       # identité fédérée OIDC
  pull-requests: write  # commentaire du plan

concurrency:
  group: terraform-${{ github.event.inputs.environment || github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.10.5"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  # -------------------------------------------------------------------------
  quality:
    name: fmt & validate
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      - name: terraform validate (tous les environnements)
        run: |
          for env in dev test prod; do
            echo "::group::validate $env"
            terraform -chdir=environments/$env init -backend=false
            terraform -chdir=environments/$env validate
            echo "::endgroup::"
          done

      - name: Analyse de sécurité statique (Checkov)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          soft_fail: true   # informatif : n'empêche pas le plan
          quiet: true

  # -------------------------------------------------------------------------
  targets:
    name: environnements ciblés
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.pick.outputs.envs }}
    steps:
      - id: pick
        run: |
          case "${{ github.event_name }}" in
            pull_request)      echo 'envs=["dev","test","prod"]' >> "$GITHUB_OUTPUT" ;;
            push)              echo 'envs=["dev"]' >> "$GITHUB_OUTPUT" ;;
            workflow_dispatch) echo 'envs=["${{ github.event.inputs.environment }}"]' >> "$GITHUB_OUTPUT" ;;
          esac

  # -------------------------------------------------------------------------
  plan:
    name: plan (${{ matrix.env }})
    needs: [quality, targets]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.targets.outputs.envs) }}
    defaults:
      run:
        working-directory: environments/${{ matrix.env }}
    env:
      PLAN_FLAGS: ${{ github.event.inputs.action == 'destroy' && '-destroy' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Authentification : OIDC si le rôle est configuré, sinon secrets (Learner Lab)
      - name: Authentification AWS (OIDC)
        if: ${{ vars.AWS_PLAN_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Authentification AWS (secrets)
        if: ${{ vars.AWS_PLAN_ROLE_ARN == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        run: >
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ env.AWS_REGION }}"

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform plan $PLAN_FLAGS -lock-timeout=5m -detailed-exitcode -out=tfplan
          code=$?
          set -e
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          [ "$code" -eq 1 ] && exit 1 || exit 0

      - name: Plan lisible
        run: |
          terraform show -no-color tfplan > plan.txt
          {
            echo "### Plan Terraform — \`${{ matrix.env }}\`"
            echo '```'
            grep -E '^(Plan:|No changes|Changes to Outputs)' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier le plan (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.env }}
          path: |
            environments/${{ matrix.env }}/tfplan
            environments/${{ matrix.env }}/plan.txt
          retention-days: 5

      - name: Commenter la Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          ENV_NAME: ${{ matrix.env }}
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('environments/' + process.env.ENV_NAME + '/plan.txt', 'utf8');
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... (tronqué, voir artefact)';
            const summary = (plan.match(/^(Plan:.*|No changes.*)$/m) || ['?'])[0];
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `#### Terraform plan — \`${process.env.ENV_NAME}\`\n**${summary}**\n<details><summary>Afficher le plan</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n</details>`
            });

  # -------------------------------------------------------------------------
  apply:
    name: ${{ github.event.inputs.action || 'apply' }} (${{ matrix.env }})
    needs: [targets, plan]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: ${{ fromJSON(needs.targets.outputs.envs) }}
    # test et prod : "Required reviewers" + branche main uniquement (Settings > Environments)
    environment:
      name: ${{ matrix.env }}
    defaults:
      run:
        working-directory: environments/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Authentification AWS (OIDC)
        if: ${{ vars.AWS_APPLY_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Authentification AWS (secrets)
        if: ${{ vars.AWS_APPLY_ROLE_ARN == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Récupérer le plan validé
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ matrix.env }}
          path: environments/${{ matrix.env }}

      - name: terraform init
        run: >
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ env.AWS_REGION }}"

      # Applique exactement le plan relu (apply d'un fichier de plan = pas de nouvelle évaluation)
      - name: terraform apply tfplan
        run: terraform apply -lock-timeout=5m tfplan

      - name: Sorties
        if: github.event.inputs.action != 'destroy'
        run: |
          terraform output
          echo "### URL : $(terraform output -raw alb_url)" >> "$GITHUB_STEP_SUMMARY"
